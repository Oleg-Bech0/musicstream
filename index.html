<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicStream - Your Music Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="vortex" id="vortex" style="--_num-elements: 48; --_num-sub-elements: 12"></div>
    <div class="container">
        <header class="header">
            <div class="logo"><h1>🎵 MusicStream</h1></div>
            <div class="search-box"><input type="text" id="searchInput" placeholder="Search songs..."></div>
            <div class="header-icons"><button class="icon-btn" id="importBtn">Import Likes</button><button class="icon-btn">⚙️</button></div>
        </header>

        <div class="main-layout">
            <aside class="sidebar">
                <nav class="nav-menu">
                    <button class="nav-item active">🏠 Home</button>
                    <button class="nav-item">🔥 Trending</button>
                    <button class="nav-item">🌍 International</button>
                    <button class="nav-item">❤️ Favorites</button>
                    <button class="nav-item">📻 Radio</button>
                </nav>
            </aside>

            <section class="content">
                <h2>Now Playing</h2>
                <div class="track-grid" id="trackGrid"></div>
            </section>
        </div>

        <footer class="player">
            <div class="player-info">
                <div class="album-art" id="albumArt">🎵</div>
                <div class="track-details">
                    <div class="track-title" id="trackTitle">Select a song</div>
                    <div class="track-artist" id="trackArtist">Artist</div>
                </div>
            </div>
            <div class="player-controls">
                <button class="player-btn" id="prevBtn" title="Previous">⏮️</button>
                <button class="player-btn play-btn" id="playBtn" title="Play">▶️</button>
                <button class="player-btn" id="nextBtn" title="Next">⏭️</button>
            </div>
            <div class="player-progress">
                <span id="currentTime">0:00</span>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div><input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0"></div>
                <span id="duration">0:00</span>
            </div>
            <div class="player-volume"><span>🔊</span><input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70"></div>
        </footer>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
